name: Mise à jour des cours boursiers

on:
  schedule:
    # Toutes les heures de 13h à 22h UTC (heures d'ouverture US)
    # 9h-18h heure NY = 13h-22h UTC
    - cron: '0 13-22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-stocks.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔄 Récupération des cours
        run: node scripts/fetch-yahoo.js

      - name: 📝 Vérification
        run: |
          if [ -f data/stocks.json ]; then
            echo "✅ Fichier généré :"
            head -30 data/stocks.json
          else
            echo "❌ Aucun fichier généré"
            exit 1
          fi

      - name: 💾 Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          if git diff --staged --quiet; then
            echo "ℹ️  Aucun changement"
          else
            git commit -m "chore: mise à jour cours $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Données poussées"
          fi
